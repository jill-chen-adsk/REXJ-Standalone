<!doctype html>
<html lang="ja">
  <head>
    <title>個別パラメータ追加機能</title>
	  <link rel="stylesheet" href="style.css">
  </head>
  <body>
  <div class="base">
	  <div class="Left">
		  <iframe src="menu.html" width="100%" height="100%"></iframe>
	  </div>
	  <div class="Right">
    <H2>個別パラメータ追加機能</H2>
	<table width="600" align="left" cellspacing="0" border="0">						
			<tr><td>
				<table width="600" align="left" cellspacing="0" border="0">
					<tr bgcolor="#ffffff"><td bgcolor="#ffffff">
					個別パラメータ追加機能は、任意のファミリにマッピングテーブルで設定されたパラメータを追加するコマンドである。
					プロジェクトで使用する場合はファミリは構造柱・構造フレーム・構造壁・構造床・構造基礎ごとに選択可能とし、
					ファミリエディタで使用する場合はファミリエディタで開いているファミリにマッピングテーブルで設定したパラメータを追加するものとする。
					構造壁、構造床はシステムファミリのためファミリの選択は不可とし、マッピングテーブルで設定した壁または床のパラメータのみ追加可能である。
					なお、構造壁・構造床のパラメータ追加はプロジェクトでのみ使用可能である。<br>
					</td></tr>
					<tr></tr>
					<tr bgcolor="#ffffff"><td bgcolor="#ffffff"><img src="Image/052_01.png" alt=""></td></tr>
				</table>
			</td></tr>
	</table>
	  </div>
  </div>
  </body>
</html>
