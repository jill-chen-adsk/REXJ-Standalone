<!doctype html>
<html lang="ja">
<head>
    <title>エクスポートするST-Bridgeファイルの選択</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="base">
    <div class="Left">
        <iframe src="menu.html" width="100%" height="100%"></iframe>
    </div>
    <div class="Right">
        <H2>エクスポートするST-Bridgeファイルの選択</H2>
        <table width="600" align="left">
            <tr>
                <td><p>モデルエクスポートを行うST-Bridgeファイルを選択する。</p></td>
            </tr>

            <tr height="15">
                <td><p></p></td>
            </tr>

            <tr>
                <td>
                    <p><img src="image/054_1.png" style="WIDTH: 611px"></p>
                </td>
            </tr>


            <tr height="15">
                <td><p></p></td>
            </tr>

            <tr>
                <td>
                    <table BORDER="0" width="600" cellspacing="0">
                        <strong>■&nbsp;各ボタン操作</strong>
                        <tr>
                            <td>
                                <table width="600" border="0" cellspacing="1" bgcolor="#000000" cellpadding="5">
                                    <tr>
                                        <td bgcolor="#ddffee" align="center"><img src="image/054_3.png" alt=""></td>
                                        <td bgcolor="#ffffff">
                                            選択した ST-Bridge ファイルを保存する
                                        </td>
                                    </tr>
                                    <tr>
                                        <td bgcolor="#ddffee" align="center"><img src="image/021_03.png" alt=""></td>
                                        <td bgcolor="#ffffff">
                                            ファイル選択を中止し ST-Bridge Link を終了する
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                    </table>
                    <br>
                    <table BORDER="0" width="600" cellspacing="0">
                        <strong>■&nbsp;ファイルの種類</strong>
                        <tr>
                            <td>
                                <table width="600" border="0" cellspacing="1" bgcolor="#000000" cellpadding="5">
                                    <tr>
                                        <td bgcolor="#ddffee" align="center"><img src="image/054_2.png" alt=""></td>
                                    </tr>
                                    <tr>
                                        <td bgcolor="#ffffff">
                                            ファイルの種類でエクスポートするST-Bridgeファイルのバージョン（Ver1.4/2.0）を指定する
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
            <tr height="15">
                <td><p></p></td>
            </tr>
        </table>
    </div>
</div>

</html>
