<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Layout parts drawing</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      --bg: #263545;
      --bg-input: #1e2a3a;
      --text: #e0e8f0;
      --text-label: #8fa4b8;
      --border: #3a4f63;
      --border-hover: #5a7a94;
      --accent: #4dacff;
      --accent-hover: #6dbbff;
      --accent-text: #0d1b2a;
      --radio-border: #5a7a94;
      --select-bg: #1e2a3a;
      --select-hover: #2a3d52;
      --select-active: #35506a;
    }

    body[data-theme="light"] {
      --bg: #f5f5f5;
      --bg-input: #ffffff;
      --text: #1a1a1a;
      --text-label: #555555;
      --border: #d0d0d0;
      --border-hover: #999999;
      --accent: #0066cc;
      --accent-hover: #0052a3;
      --accent-text: #ffffff;
      --radio-border: #999999;
      --select-bg: #ffffff;
      --select-hover: #e8e8e8;
      --select-active: #d4e8fc;
    }

    body {
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    .divider { border: none; border-top: 1px solid var(--border); }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .section-label {
      font-size: 11px;
      color: var(--text-label);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 2px;
    }

    /* Filter radio group */
    .filter-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .filter-row .section-label { margin-bottom: 0; margin-right: 4px; }

    .radio-label {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
    }
    .radio-label input[type="radio"] {
      appearance: none;
      width: 16px; height: 16px;
      border: 2px solid var(--radio-border);
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
    }
    .radio-label input[type="radio"]:checked { border-color: var(--accent); }
    .radio-label input[type="radio"]:checked::after {
      content: '';
      position: absolute;
      top: 3px; left: 3px;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }
    .radio-label input[type="radio"]:hover { border-color: var(--accent); }

    /* Dual-list area */
    .dual-list {
      display: flex;
      gap: 8px;
      flex: 1;
      min-height: 0;
    }

    .list-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .list-box {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg-input);
      overflow-y: auto;
      min-height: 180px;
    }

    .list-item {
      padding: 5px 8px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }
    .list-item:hover { background: var(--select-hover); }
    .list-item.selected { background: var(--select-active); }
    .list-item.newline-marker {
      color: var(--text-label);
      font-style: italic;
    }

    /* Action buttons column */
    .list-actions {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-action {
      font-family: inherit;
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      min-width: 60px;
      text-align: center;
    }
    .btn-action:hover { border-color: var(--border-hover); background: var(--select-hover); }
    .btn-action:disabled {
      opacity: 0.4;
      cursor: default;
    }
    .btn-action:disabled:hover { border-color: var(--border); background: transparent; }

    /* Margins section */
    .margins-grid {
      display: grid;
      grid-template-columns: auto 1fr auto 1fr;
      gap: 6px 10px;
      align-items: center;
    }
    .margins-grid label {
      font-size: 12px;
      color: var(--text-label);
      text-align: right;
    }
    .margins-grid input[type="number"] {
      width: 100%;
      padding: 5px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }
    .margins-grid input[type="number"]:focus { border-color: var(--accent); }

    /* Footer */
    .footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 16px;
    }

    button.btn-footer {
      font-family: inherit;
      font-size: 13px;
      padding: 6px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-cancel {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
    }
    .btn-cancel:hover { background: rgba(0, 102, 204, 0.08); }
    .btn-ok {
      background: var(--accent);
      border: 1px solid var(--accent);
      color: var(--accent-text);
    }
    .btn-ok:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn-disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-disabled:hover { background: var(--accent); border-color: var(--accent); }
    .footer-hint { font-size: 12px; color: var(--accent); margin-right: auto; font-style: italic; }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: var(--text-label);
    }
  </style>
</head>
<body>
  <div id="app" class="loading">Loading...</div>

  <script>
    (function() {
      var allViewsExist = [];
      var viewsExist = [];
      var viewsTarget = [];
      var selectedExist = -1;
      var selectedTarget = -1;
      var filterType = 0;
      var blankTop = 10;
      var blankBottom = 10;
      var blankLeft = 10;
      var blankRight = 10;

      var WINDOW_PREFIXES = ['\u59ff\u56f3_\u7a93', 'Elevation_Window'];
      var DOOR_PREFIXES = ['\u59ff\u56f3_\u30c9\u30a2', 'Elevation_Door'];

      function postMessage(msg) {
        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage(msg);
        }
      }

      function matchesFilter(name, type) {
        if (type === 2) return true;
        var prefixes = type === 0 ? WINDOW_PREFIXES : DOOR_PREFIXES;
        for (var i = 0; i < prefixes.length; i++) {
          if (name.indexOf(prefixes[i]) !== -1) return true;
        }
        return false;
      }

      function applyFilter() {
        viewsExist = [];
        for (var i = 0; i < allViewsExist.length; i++) {
          if (matchesFilter(allViewsExist[i].name, filterType)) {
            viewsExist.push(allViewsExist[i]);
          }
        }
        selectedExist = -1;
      }

      function escHtml(str) {
        if (str == null) return '';
        var d = document.createElement('div');
        d.textContent = String(str);
        return d.innerHTML;
      }

      function clamp(val, min, max) {
        val = parseInt(val, 10);
        if (isNaN(val)) return min;
        if (val < min) return min;
        if (val > max) return max;
        return val;
      }

      window.initSettings = function(data) {
        if (data.theme) {
          document.body.setAttribute('data-theme', data.theme);
        }

        if (data.viewsExist) allViewsExist = data.viewsExist.slice();
        if (data.viewsTarget) viewsTarget = data.viewsTarget.slice();
        if (data.currentSettings) {
          filterType = data.currentSettings.viewTypeOpt != null ? data.currentSettings.viewTypeOpt : 0;
          blankTop = data.currentSettings.blankTop != null ? data.currentSettings.blankTop : 10;
          blankBottom = data.currentSettings.blankBottom != null ? data.currentSettings.blankBottom : 10;
          blankLeft = data.currentSettings.blankLeft != null ? data.currentSettings.blankLeft : 10;
          blankRight = data.currentSettings.blankRight != null ? data.currentSettings.blankRight : 10;
        }

        removeTargetFromExist();
        applyFilter();
        render();
      };

      function removeTargetFromExist() {
        var targetIds = {};
        for (var i = 0; i < viewsTarget.length; i++) {
          if (viewsTarget[i].id !== 0) {
            targetIds[viewsTarget[i].id] = true;
          }
        }
        allViewsExist = allViewsExist.filter(function(v) {
          return !targetIds[v.id];
        });
      }

      function renderListItems(items, selectedIdx, isTarget) {
        var html = '';
        for (var i = 0; i < items.length; i++) {
          var cls = 'list-item';
          if (i === selectedIdx) cls += ' selected';
          if (isTarget && items[i].id === 0) cls += ' newline-marker';
          html += '<div class="' + cls + '" data-idx="' + i + '">' + escHtml(items[i].name) + '</div>';
        }
        return html;
      }

      function render() {
        var windowChk = filterType === 0 ? ' checked' : '';
        var doorChk = filterType === 1 ? ' checked' : '';
        var bothChk = filterType === 2 ? ' checked' : '';

        var hasExist = viewsExist.length > 0;
        var hasTarget = viewsTarget.length > 0;
        var hasMultiTarget = viewsTarget.length > 1;
        var existSelected = selectedExist > -1;
        var targetSelected = selectedTarget > -1;

        var canMove = hasExist && existSelected;
        var canDel = hasTarget && targetSelected;
        var canUp = hasMultiTarget && targetSelected && selectedTarget > 0;
        var canDown = hasMultiTarget && targetSelected && selectedTarget < viewsTarget.length - 1;

        document.getElementById('app').innerHTML =
          '<div class="content">' +
            '<div class="filter-row">' +
              '<span class="section-label">Filter:</span>' +
              '<label class="radio-label"><input type="radio" name="filter" value="0"' + windowChk + ' />Window</label>' +
              '<label class="radio-label"><input type="radio" name="filter" value="1"' + doorChk + ' />Door</label>' +
              '<label class="radio-label"><input type="radio" name="filter" value="2"' + bothChk + ' />Both</label>' +
            '</div>' +
            '<div class="dual-list">' +
              '<div class="list-panel">' +
                '<span class="section-label">Available Views</span>' +
                '<div class="list-box" id="listExist">' + renderListItems(viewsExist, selectedExist, false) + '</div>' +
              '</div>' +
              '<div class="list-actions">' +
                '<button class="btn-action" id="btnMove"' + (canMove ? '' : ' disabled') + '>&gt;&gt;</button>' +
                '<button class="btn-action" id="btnDel"' + (canDel ? '' : ' disabled') + '>&lt;&lt;</button>' +
              '</div>' +
              '<div class="list-panel">' +
                '<span class="section-label">Target Views</span>' +
                '<div class="list-box" id="listTarget">' + renderListItems(viewsTarget, selectedTarget, true) + '</div>' +
              '</div>' +
              '<div class="list-actions">' +
                '<button class="btn-action" id="btnUp"' + (canUp ? '' : ' disabled') + '>Up</button>' +
                '<button class="btn-action" id="btnDown"' + (canDown ? '' : ' disabled') + '>Down</button>' +
                '<button class="btn-action" id="btnNewLine">New Line</button>' +
              '</div>' +
            '</div>' +
            '<hr class="divider" />' +
            '<div>' +
              '<span class="section-label">Margins</span>' +
              '<div class="margins-grid" style="margin-top:6px">' +
                '<label>Top:</label>' +
                '<input type="number" id="inpTop" min="0" max="999" value="' + blankTop + '" />' +
                '<label>Bottom:</label>' +
                '<input type="number" id="inpBottom" min="0" max="999" value="' + blankBottom + '" />' +
                '<label>Left:</label>' +
                '<input type="number" id="inpLeft" min="0" max="999" value="' + blankLeft + '" />' +
                '<label>Right:</label>' +
                '<input type="number" id="inpRight" min="0" max="999" value="' + blankRight + '" />' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<hr class="divider" />' +
          '<div class="footer">' +
            '<span class="footer-hint" id="footerHint"' + (hasTarget ? ' style="display:none"' : '') + '>Move at least one view to Target list</span>' +
            '<button class="btn-footer btn-cancel" id="btnCancel">Cancel</button>' +
            '<button class="btn-footer btn-ok' + (hasTarget ? '' : ' btn-disabled') + '" id="btnOK"' + (hasTarget ? '' : ' disabled') + '>OK</button>' +
          '</div>';

        document.getElementById('app').className = '';
        bindEvents();
      }

      function bindEvents() {
        var radios = document.querySelectorAll('input[name="filter"]');
        for (var i = 0; i < radios.length; i++) {
          radios[i].addEventListener('change', function(ev) {
            filterType = parseInt(ev.target.value, 10);
            applyFilter();
            render();
          });
        }

        document.getElementById('listExist').addEventListener('click', function(ev) {
          var el = ev.target.closest('.list-item');
          if (!el) return;
          selectedExist = parseInt(el.getAttribute('data-idx'), 10);
          render();
        });

        document.getElementById('listTarget').addEventListener('click', function(ev) {
          var el = ev.target.closest('.list-item');
          if (!el) return;
          selectedTarget = parseInt(el.getAttribute('data-idx'), 10);
          render();
        });

        document.getElementById('btnMove').addEventListener('click', function() {
          if (selectedExist < 0 || selectedExist >= viewsExist.length) return;
          var item = viewsExist[selectedExist];
          viewsTarget.push(item);
          viewsExist.splice(selectedExist, 1);
          allViewsExist = allViewsExist.filter(function(v) { return v.id !== item.id; });
          selectedTarget = viewsTarget.length - 1;
          if (selectedExist >= viewsExist.length) selectedExist = viewsExist.length - 1;
          render();
        });

        document.getElementById('btnDel').addEventListener('click', function() {
          if (selectedTarget < 0 || selectedTarget >= viewsTarget.length) return;
          var item = viewsTarget[selectedTarget];
          viewsTarget.splice(selectedTarget, 1);
          if (item.id !== 0) {
            allViewsExist.push(item);
            allViewsExist.sort(function(a, b) {
              return a.name.localeCompare(b.name);
            });
            applyFilter();
          }
          if (selectedTarget >= viewsTarget.length) selectedTarget = viewsTarget.length - 1;
          render();
        });

        document.getElementById('btnUp').addEventListener('click', function() {
          if (selectedTarget <= 0 || selectedTarget >= viewsTarget.length) return;
          var temp = viewsTarget[selectedTarget];
          viewsTarget[selectedTarget] = viewsTarget[selectedTarget - 1];
          viewsTarget[selectedTarget - 1] = temp;
          selectedTarget--;
          render();
        });

        document.getElementById('btnDown').addEventListener('click', function() {
          if (selectedTarget < 0 || selectedTarget >= viewsTarget.length - 1) return;
          var temp = viewsTarget[selectedTarget];
          viewsTarget[selectedTarget] = viewsTarget[selectedTarget + 1];
          viewsTarget[selectedTarget + 1] = temp;
          selectedTarget++;
          render();
        });

        document.getElementById('btnNewLine').addEventListener('click', function() {
          var insertAt = selectedTarget >= 0 ? selectedTarget + 1 : viewsTarget.length;
          viewsTarget.splice(insertAt, 0, { id: 0, name: '<New Line>' });
          selectedTarget = insertAt;
          render();
        });

        document.getElementById('inpTop').addEventListener('change', function(ev) {
          blankTop = clamp(ev.target.value, 0, 999);
          ev.target.value = blankTop;
        });
        document.getElementById('inpBottom').addEventListener('change', function(ev) {
          blankBottom = clamp(ev.target.value, 0, 999);
          ev.target.value = blankBottom;
        });
        document.getElementById('inpLeft').addEventListener('change', function(ev) {
          blankLeft = clamp(ev.target.value, 0, 999);
          ev.target.value = blankLeft;
        });
        document.getElementById('inpRight').addEventListener('change', function(ev) {
          blankRight = clamp(ev.target.value, 0, 999);
          ev.target.value = blankRight;
        });

        document.getElementById('btnOK').addEventListener('click', function() {
          if (viewsTarget.length === 0) return;
          postMessage({
            action: 'ok',
            viewTypeOpt: filterType,
            blankTop: blankTop,
            blankBottom: blankBottom,
            blankLeft: blankLeft,
            blankRight: blankRight,
            targetViews: viewsTarget
          });
        });

        document.getElementById('btnCancel').addEventListener('click', function() {
          postMessage({ action: 'cancel' });
        });
      }
    })();
  </script>
</body>
</html>
