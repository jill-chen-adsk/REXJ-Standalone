beacode:
  target_branch: "main"
  # Start advisory-only; set true after validating BeaCode signal quality on this repo.
  review_request_changes: false
  auto_resolve_threads: true
  # Skip WIP draft PRs to reduce noise; set true if you want early feedback on drafts.
  review_draft_prs: false
  beta_feature_flags:
    new_review_prompt: true
    context_management: true
  guidelines:
    enabled: true
    file_path: ".beacode/best-practices.md"
